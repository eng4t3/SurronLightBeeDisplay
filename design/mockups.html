<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LightBee Display UI Mockups</title>
<style>
@font-face { font-family: 'BSC'; src: url('../tools/fonts/BarlowSemiCondensed-Medium.ttf') format('truetype'); font-weight: 500; }
@font-face { font-family: 'BSC'; src: url('../tools/fonts/BarlowSemiCondensed-SemiBold.ttf') format('truetype'); font-weight: 600; }
@font-face { font-family: 'BSC'; src: url('../tools/fonts/BarlowSemiCondensed-Bold.ttf') format('truetype'); font-weight: 700; }
:root { --bg:#0d0f12; --panel:#15181d; --line:#262b33; --tx:#d6dbe2; --dim:#8a94a3; --acc:#21C7FF; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 500 15px/1.45 'BSC', system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center;
  padding: 12px 24px; background: rgba(13,15,18,.94); border-bottom: 1px solid var(--line); }
header h1 { font: 700 20px 'BSC'; letter-spacing: .5px; margin: 0; }
header h1 span { color: var(--acc); }
header label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); cursor: pointer; }
header button { font: 600 14px 'BSC'; background: #1d232b; color: var(--tx); border: 1px solid #2c3440; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
header button:hover { border-color: var(--acc); }
#status { color: var(--dim); font-size: 14px; }
main { padding: 8px 24px 80px; }
section h2 { font: 600 13px 'BSC'; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); margin: 34px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
section p.note { color: var(--dim); max-width: 980px; margin: -4px 0 16px; }
.grid { display: flex; flex-wrap: wrap; gap: 26px 26px; }
figure { margin: 0; }
figure canvas { display: block; width: 960px; height: 640px; image-rendering: pixelated; border-radius: 4px; box-shadow: 0 0 0 1px #262b33, 0 10px 30px rgba(0,0,0,.45); }
body.x1 figure canvas { width: 480px; height: 320px; }
figcaption { margin-top: 8px; display: flex; gap: 10px; align-items: baseline; }
figcaption b { font-weight: 600; color: var(--tx); }
figcaption code { color: var(--dim); font: 500 13px ui-monospace, Consolas, monospace; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-width: 1400px; }
.sw { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.sw i { width: 34px; height: 34px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(128,128,128,.35); flex: none; }
.sw div { font-size: 12.5px; line-height: 1.3; }
.sw div b { display: block; font-size: 13px; }
#warn { color: #FFB221; white-space: pre-wrap; font: 13px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>LightBee Display <span>UI</span> · 480×320 mockups</h1>
  <label><input type="checkbox" id="optQ" checked> RGB565 preview</label>
  <label><input type="checkbox" id="optT"> touch targets</label>
  <label><input type="checkbox" id="opt1x"> 1:1 size</label>
  <button id="btnExport">Export PNGs + spec</button>
  <span id="status"></span>
</header>
<main id="app">
  <section><h2>Colour tokens (snapped to RGB565)</h2><div class="swatches" id="swatches"></div><div id="warn"></div></section>
</main>
<script>
'use strict';
/* =====================================================================================
   LightBee Display UI — design mockups.
   Everything is drawn with primitives that map 1:1 to the AA engine:
     rrect / rrectStroke / rrectVGrad / circle / ring / arc (+angle gradient, round caps)
     capsule / poly (convex) / glow (radial falloff) / vignette / text (4-bit AA, tracking,
     tabular digits) / icon (4bpp mask).
   Angles: compass degrees — 0° = 12 o'clock, positive = clockwise.
   Text y = BASELINE. Text x = anchor (left / center / right edge of ink-advance box).
   ===================================================================================== */
const W = 480, H = 320;

/* ------------------------------------------------------------------ colour tokens */
const THEMES = {
  dark: {
    bg: '#080C10', surface: '#101418', surface_hi: '#181C21', border: '#212831', track: '#182029',
    text_hi: '#F7FBFF', text: '#D6DBDE', text_dim: '#8C9AA5', text_faint: '#525D6B',
    accent: '#21C7FF', on_accent: '#001018', green: '#31D784', amber: '#FFB221', red: '#FF5152',
    on_amber: '#181000', face: '#101418', metal_hi: '#C6CBD6', metal_lo: '#39414A', qr_bg: '#FFFFFF', qr_fg: '#000000',
    shadow: '#000000',
  },
  light: {
    bg: '#EFF3F7', surface: '#FFFFFF', surface_hi: '#E7EBEF', border: '#CED3DE', track: '#DEE3E7',
    text_hi: '#000408', text: '#182431', text_dim: '#4A5563', text_faint: '#8C96A5',
    accent: '#0079C6', on_accent: '#FFFFFF', green: '#089A4A', amber: '#C67500', red: '#D62439',
    on_amber: '#FFFFFF', face: '#FFFFFF', metal_hi: '#EFF3F7', metal_lo: '#94A2AD', qr_bg: '#FFFFFF', qr_fg: '#000000',
    shadow: '#4A5563',
  },
};
const TOKEN_DOC = {
  bg: 'Screen background', surface: 'Cards, tiles, panels', surface_hi: 'Pressed / raised / inactive knob',
  border: 'Hairlines, card strokes', track: 'Gauge / slider / bar tracks, unlit segments',
  text_hi: 'Hero numbers, primary values', text: 'Body text', text_dim: 'Labels, units, secondary',
  text_faint: 'Decorative / disabled only (never info)', accent: 'Primary accent, speed zone 1, selection',
  on_accent: 'Text/icons on accent fills', green: 'OK / ready / success', amber: 'Speed zone 2, best, warnings',
  red: 'Speed zone 3, destructive, errors', on_amber: 'Text on amber (DEMO badge)', face: 'CHRONO dial face',
  metal_hi: 'CHRONO bezel highlight', metal_lo: 'CHRONO bezel shadow', qr_bg: 'QR quiet zone (both themes)',
  qr_fg: 'QR modules', shadow: 'Shadow base (used with alpha)',
};
const GLOW_K = { dark: 1, light: 0.55 };      // glow alpha multiplier per theme
let THEME = 'dark', T = THEMES.dark, LANG = 'en';
const tr = (en, hu) => (LANG === 'hu' ? hu : en);

function to565(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return ((r >> 3) << 11) | ((g >> 2) << 5) | (b >> 3);
}
function from565(v) {
  const r = v >> 11, g = (v >> 5) & 63, b = v & 31;
  const R = (r << 3) | (r >> 2), G = (g << 2) | (g >> 4), B = (b << 3) | (b >> 2);
  return '#' + [R, G, B].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
}
const hex565 = v => '0x' + v.toString(16).toUpperCase().padStart(4, '0');
const WARN = [];
for (const [tn, th] of Object.entries(THEMES)) for (const [k, v] of Object.entries(th))
  if (from565(to565(v)) !== v.toUpperCase()) WARN.push(`${tn}.${k} ${v} is not exact RGB565 (-> ${from565(to565(v))})`);

function C(c, a = 1) {
  const hex = c[0] === '#' ? c : T[c];
  if (!hex) throw new Error('unknown colour ' + c);
  if (a >= 1) return hex;
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function mix(c1, c2, t) {
  const a = parseInt(C(c1).slice(1), 16), b = parseInt(C(c2).slice(1), 16);
  const ch = s => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
  return '#' + [ch(16), ch(8), ch(0)].map(x => x.toString(16).padStart(2, '0')).join('');
}

/* speed zones — fraction of gauge full scale (85 km/h / 50 mph) */
const ZONE = { z2: 0.60, z3: 0.85 };            // flat colour thresholds
const ZONE_GRAD = [[0, 'accent'], [0.50, 'accent'], [0.72, 'amber'], [0.86, 'amber'], [0.97, 'red'], [1, 'red']];
const zoneTok = p => (p < ZONE.z2 ? 'accent' : p < ZONE.z3 ? 'amber' : 'red');

/* ------------------------------------------------------------------ fonts */
const FONTS = {
  LABEL:   { w: 600, s: 13,  track: 1.5, upper: true, file: 'SemiBold' },
  SMALL:   { w: 500, s: 15,  track: 0,   file: 'Medium' },
  BODY:    { w: 500, s: 18,  track: 0,   file: 'Medium' },
  BODYB:   { w: 600, s: 18,  track: 0,   file: 'SemiBold' },
  TITLE:   { w: 600, s: 24,  track: 0,   file: 'SemiBold' },
  NUM_M:   { w: 700, s: 32,  track: 0,   tab: true, file: 'Bold' },
  NUM_L:   { w: 700, s: 56,  track: 0,   tab: true, file: 'Bold', glyphs: '0123456789.:-%+ ' },
  NUM_XL:  { w: 700, s: 128, track: -2,  tab: true, file: 'Bold', glyphs: '0123456789.:-%+ ' },
  NUM_XXL: { w: 700, s: 168, track: -4,  tab: true, file: 'Bold', glyphs: '0123456789' },
};
let g;                                   // current 2D context (480x320)
const advCache = {};
function fontCss(f) { return `${f.w} ${f.s}px BSC`; }
function adv(f, ch) {
  const k = f.w + '/' + f.s + '/' + ch;
  if (!(k in advCache)) { g.font = fontCss(f); advCache[k] = Math.round(g.measureText(ch).width); }
  return advCache[k];
}
function digitCell(f) { let m = 0; for (const d of '0123456789') m = Math.max(m, adv(f, d)); return m; }
function layout(str, f, track) {
  const cell = f.tab ? digitCell(f) : 0;
  let x = 0; const items = [];
  for (const ch of str) {
    const isD = f.tab && ch >= '0' && ch <= '9';
    const a = isD ? cell : adv(f, ch);
    items.push({ ch, x: x + (isD ? Math.round((cell - adv(f, ch)) / 2) : 0) });
    x += a + track;
  }
  return { w: items.length ? x - track : 0, items };
}
function tw(str, font, track) {
  const f = FONTS[font]; if (f.upper) str = str.toUpperCase();
  return layout(str, f, track ?? f.track).w;
}

/* ------------------------------------------------------------------ spec recorder */
let REC = null, TOUCH = [], SHOW_TOUCH = false;
const r1 = v => Math.round(v * 10) / 10;
function cn(c, a) { return '`' + c + '`' + (a != null && a < 1 ? ` @${Math.round(a * 100)}%` : ''); }
function rec(id, o) { if (REC && id) REC.push({ id, ...o }); }
function note(id, text) { rec(id, { p: 'note', g: '', c: '', n: text }); }

/* ------------------------------------------------------------------ primitives */
const rad = d => (d - 90) * Math.PI / 180;
const polar = (cx, cy, r, d) => [cx + r * Math.cos(rad(d)), cy + r * Math.sin(rad(d))];

function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function rrect(id, x, y, w, h, r, c, a = 1, n) {
  g.fillStyle = C(c, a); rrPath(x, y, w, h, r); g.fill();
  rec(id, { p: 'rrect', g: `x=${x} y=${y} w=${w} h=${h} r=${r}`, c: cn(c, a), n });
}
function rrectStroke(id, x, y, w, h, r, c, lw = 1, a = 1, n) {   // stroke drawn INSIDE the rect
  g.strokeStyle = C(c, a); g.lineWidth = lw; rrPath(x + lw / 2, y + lw / 2, w - lw, h - lw, Math.max(0, r - lw / 2)); g.stroke();
  rec(id, { p: `rrect stroke ${lw}px (inside)`, g: `x=${x} y=${y} w=${w} h=${h} r=${r}`, c: cn(c, a), n });
}
function rrectVGrad(id, x, y, w, h, r, c0, c1, n) {
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, C(c0)); gr.addColorStop(1, C(c1));
  g.fillStyle = gr; rrPath(x, y, w, h, r); g.fill();
  rec(id, { p: 'rrect v-gradient', g: `x=${x} y=${y} w=${w} h=${h} r=${r}`, c: `${cn(c0)} → ${cn(c1)}`, n });
}
function rect(id, x, y, w, h, c, a = 1, n) {
  g.fillStyle = C(c, a); g.fillRect(x, y, w, h);
  rec(id, { p: 'rect', g: `x=${x} y=${y} w=${w} h=${h}`, c: cn(c, a), n });
}
function hline(id, x, y, w, c = 'border', a = 1) { g.fillStyle = C(c, a); g.fillRect(x, y, w, 1); rec(id, { p: 'hline 1px', g: `x=${x} y=${y} w=${w}`, c: cn(c, a) }); }
function vline(id, x, y, h, c = 'border', a = 1) { g.fillStyle = C(c, a); g.fillRect(x, y, 1, h); rec(id, { p: 'vline 1px', g: `x=${x} y=${y} h=${h}`, c: cn(c, a) }); }
function circle(id, cx, cy, r, c, a = 1, n) {
  g.fillStyle = C(c, a); g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  rec(id, { p: 'circle', g: `c=(${r1(cx)},${r1(cy)}) r=${r}`, c: cn(c, a), n });
}
function ring(id, cx, cy, r, lw, c, a = 1, n) {           // r = centre-line radius
  g.strokeStyle = C(c, a); g.lineWidth = lw; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  rec(id, { p: 'ring', g: `c=(${r1(cx)},${r1(cy)}) r=${r} th=${lw}`, c: cn(c, a), n });
}
/* arc: centre-line radius r, thickness th, from d0 to d1 (compass deg, clockwise).
   o.grad = [[p, token]...] positions p along the FULL sweep (o.a0 .. o.a0+o.sweep), angle-dependent colour.
   Caps take the colour of the nearest arc end. */
function arc(id, cx, cy, r, th, d0, d1, c, o = {}) {
  if (d1 - d0 < 0.01 && o.caps !== 'butt') { // zero-length -> round dot
    const [x, y] = polar(cx, cy, r, d0); g.fillStyle = o.grad ? C(o.grad[0][1]) : C(c, o.a ?? 1);
    g.beginPath(); g.arc(x, y, th / 2, 0, 7); g.fill();
  } else {
    g.save(); g.lineWidth = th; g.lineCap = o.caps || 'round';
    if (o.grad) {
      const lead = Math.min(25, (360 - o.sweep) / 2), cg = g.createConicGradient(rad(o.a0 - lead), cx, cy);
      cg.addColorStop(0, C(o.grad[0][1]));
      for (const [p, t] of o.grad) cg.addColorStop((lead + p * o.sweep) / 360, C(t, o.a ?? 1));
      cg.addColorStop(1, C(o.grad[o.grad.length - 1][1]));
      g.strokeStyle = cg;
    } else g.strokeStyle = C(c, o.a ?? 1);
    g.beginPath(); g.arc(cx, cy, r, rad(d0), rad(d1)); g.stroke(); g.restore();
  }
  const gs = o.grad ? 'angle-gradient ' + o.grad.map(([p, t]) => `${Math.round(p * 100)}%:${t}`).join(' ') + ` over ${o.a0}°..${o.a0 + o.sweep}°` : cn(c, o.a);
  rec(id, { p: `arc (${o.caps || 'round'} caps)`, g: `c=(${cx},${cy}) r=${r} th=${th} ${r1(d0)}°→${r1(d1)}°`, c: gs, n: o.n });
}
function capsule(id, x0, y0, x1, y1, w, c, a = 1, n) {
  g.save(); g.strokeStyle = C(c, a); g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.restore();
  rec(id, { p: 'capsule', g: `(${r1(x0)},${r1(y0)})→(${r1(x1)},${r1(y1)}) w=${w}`, c: cn(c, a), n });
}
function hcapsule(id, x, y, w, th, c, a = 1, n) {        // horizontal capsule, x..x+w, centred on y
  if (w <= th) { circle(null, x + th / 2, y, th / 2, c, a); } else capsule(null, x + th / 2, y, x + w - th / 2, y, th, c, a);
  rec(id, { p: 'capsule (h)', g: `x=${r1(x)} y=${r1(y)} w=${r1(w)} th=${th}`, c: cn(c, a), n });
}
function poly(id, pts, c, a = 1, n) {
  g.fillStyle = C(c, a); g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill();
  rec(id, { p: 'poly (convex)', g: pts.map(([x, y]) => `(${r1(x)},${r1(y)})`).join(' '), c: cn(c, a), n });
}
/* radial glow: alpha(d) = A * (1 - d/r)^2 */
function glow(id, cx, cy, r, c, A, n) {
  A *= GLOW_K[THEME];
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
  for (let i = 0; i <= 8; i++) { const t = i / 8; gr.addColorStop(t, C(c, A * (1 - t) * (1 - t))); }
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
  rec(id, { p: 'glow', g: `c=(${r1(cx)},${r1(cy)}) r=${r}`, c: `${cn(c)} A=${r1(A / GLOW_K[THEME] * 100)}% (light ×${GLOW_K.light})`, n: n || 'alpha = A·(1−d/r)²' });
}
function text(id, str, font, x, y, align, c, o = {}) {
  const f = FONTS[font]; if (f.upper) str = str.toUpperCase();
  const track = o.track ?? f.track;
  if (f.glyphs) for (const ch of str) if (!f.glyphs.includes(ch)) WARN.push(`glyph '${ch}' not in ${font}: "${str}"`);
  const L = layout(str, f, track);
  let x0 = align === 'center' ? x - L.w / 2 : align === 'right' ? x - L.w : x;
  x0 = Math.round(x0);
  g.font = fontCss(f); g.fillStyle = C(c, o.a ?? 1); g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  for (const it of L.items) g.fillText(it.ch, x0 + it.x, y);
  rec(id, { p: 'text', g: `${align || 'left'} x=${x} base=${y}` + (track !== f.track ? ` track=${track}` : ''), c: cn(c, o.a), f: font, t: str, n: o.n });
  return { x0, w: L.w };
}
/* text with trailing unit in a second font, the pair aligned as one block */
function valUnit(id, val, vf, unit, uf, x, y, align, vc = 'text_hi', uc = 'text_dim', gap = 5) {
  const wv = tw(val, vf), wu = unit ? tw(unit, uf) : 0, wt = wv + (unit ? gap + wu : 0);
  const x0 = align === 'center' ? x - wt / 2 : align === 'right' ? x - wt : x;
  text(id && id + '.value', val, vf, Math.round(x0), y, 'left', vc, { n: `block ${align || 'left'}-aligned at x=${x} (value+${gap}px+unit)` });
  if (unit) text(id && id + '.unit', unit, uf, Math.round(x0 + wv + gap), y, 'left', uc);
  return wt;
}
function touch(id, x, y, w, h, action) {
  TOUCH.push({ id, x, y, w, h, action });
  if (REC && id) REC.push({ id, p: 'TOUCH', g: `x=${x} y=${y} w=${w} h=${h}`, c: '', n: action });
}
function drawTouchOverlay() {
  for (const t of TOUCH) {
    g.save(); g.fillStyle = 'rgba(255,0,200,.16)'; g.strokeStyle = 'rgba(255,0,200,.9)'; g.lineWidth = 1;
    g.fillRect(t.x, t.y, t.w, t.h); g.strokeRect(t.x + .5, t.y + .5, t.w - 1, t.h - 1);
    g.font = '600 10px BSC'; g.fillStyle = '#ff40d0'; g.fillText(`${t.w}×${t.h}`, t.x + 3, t.y + 11); g.restore();
  }
}

/* ------------------------------------------------------------------ icons (pre-rendered 4bpp masks) */
const ICONS = {
  wifi(s) { s.dot(10, 15.2, 1.9); s.arc(10, 15.2, 5.4, -46, 46); s.arc(10, 15.2, 10, -46, 46); },
  system(s) { s.line(3, 5, 17, 5); s.line(3, 10, 17, 10); s.line(3, 15, 17, 15); s.knob(12.5, 5); s.knob(6.5, 10); s.knob(14, 15); },
  skin(s) { s.rr(2.5, 2.5, 6.5, 6.5, 1.8); s.rr(11, 2.5, 6.5, 6.5, 1.8); s.rr(2.5, 11, 6.5, 6.5, 1.8); s.rrf(11, 11, 6.5, 6.5, 1.8); },
  speed(s) { s.arc(10, 11.5, 7.5, -125, 125); s.line(10, 11.5, 14.2, 7.3); s.dot(10, 11.5, 2.2); },
  odo(s) { s.rr(1.8, 5, 16.4, 10, 2.4); s.line(7.3, 5.8, 7.3, 14.2); s.line(12.7, 5.8, 12.7, 14.2); },
  lang(s) { s.circ(10, 10, 7.6); s.line(2.6, 10, 17.4, 10); s.ell(10, 10, 3.4, 7.6); },
  reset(s) { s.arc(10, 10.5, 6.6, 20, 300); s.tri([[3.2, 2.2], [9.2, 3.6], [4.6, 8.6]]); },
  check(s) { s.poly([[4, 10.5], [8.2, 14.6], [16, 6.4]]); },
  warn(s) { s.tri([[10, 2.5], [18, 16.8], [2, 16.8]]); s.cut(10, 7.2, 10, 11.6, 2.2); s.cutdot(10, 14.2, 1.3); },
  sun(s) { s.dot(10, 10, 3.6); for (let i = 0; i < 8; i++) { const a = i * 45, [x0, y0] = polar(10, 10, 6.3, a), [x1, y1] = polar(10, 10, 8.3, a); s.line(x0, y0, x1, y1); } },
  moon(s) { s.moon(); },
  phone(s) { s.rr(5.5, 2, 9, 16, 2.2); s.line(8.6, 15, 11.4, 15); },
  bolt(s) { s.tri([[11.5, 1.5], [4.5, 11.5], [10, 11.5]]); s.tri([[8.5, 18.5], [15.5, 8.5], [10, 8.5]]); },
};
function icon(id, name, x, y, size, c, a = 1) {
  const k = size / 20, col = C(c, a);
  g.save(); g.translate(x, y); g.scale(k, k);
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1.9; g.lineCap = 'round'; g.lineJoin = 'round';
  const s = {
    dot: (cx, cy, r) => { g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); },

    arc: (cx, cy, r, d0, d1) => { g.beginPath(); g.arc(cx, cy, r, rad(d0), rad(d1)); g.stroke(); },
    line: (a, b, c2, d) => { g.beginPath(); g.moveTo(a, b); g.lineTo(c2, d); g.stroke(); },
    knob: (cx, cy) => { g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(cx, cy, 3.6, 0, 7); g.fill(); g.restore(); g.beginPath(); g.arc(cx, cy, 2.3, 0, 7); g.fill(); },
    rr: (a, b, w, h, r) => { rrPath(a, b, w, h, r); g.stroke(); },
    rrf: (a, b, w, h, r) => { rrPath(a - .95, b - .95, w + 1.9, h + 1.9, r + .9); g.fill(); },
    ell: (cx, cy, rx, ry) => { g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, 7); g.stroke(); },
    tri: (p) => { g.beginPath(); p.forEach(([a, b], i) => (i ? g.lineTo(a, b) : g.moveTo(a, b))); g.closePath(); g.fill(); g.stroke(); },
    poly: (p) => { g.beginPath(); p.forEach(([a, b], i) => (i ? g.lineTo(a, b) : g.moveTo(a, b))); g.lineWidth = 2.4; g.stroke(); },
    cut: (a, b, c2, d, w) => { g.save(); g.globalCompositeOperation = 'destination-out'; g.lineWidth = w; g.beginPath(); g.moveTo(a, b); g.lineTo(c2, d); g.stroke(); g.restore(); },
    cutdot: (cx, cy, r) => { g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); g.restore(); },
    moon: () => { g.beginPath(); g.arc(10, 10, 7.2, 0, 7); g.fill(); g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(14, 6.4, 6.2, 0, 7); g.fill(); g.restore(); },
  };
  // icons that punch holes must render on their own layer
  const needsLayer = ['system', 'warn', 'moon'].includes(name);
  if (needsLayer) {

    g.save(); g.translate(1, 1); g.scale(k, k); g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 1.9; g.lineCap = 'round'; g.lineJoin = 'round';
    ICONS[name](s); g.restore(); g = saved; g.drawImage(oc, x - 1, y - 1);
  } else { ICONS[name](s); g.restore(); }
  rec(id, { p: 'icon', g: `${name} ${size}px at x=${x} y=${y} (top-left)`, c: cn(c, a) });
}

/* ------------------------------------------------------------------ sample ride data */
const RIDE = { max: 74, ride: '42:18', trip: '18.4', odo: '1 284', odoFull: '1 284.6', peakG: 0.52 };
const G_AT = { 0: 0.00, 35: 0.31, 48: 0.24, 72: 0.12 };
function gTrace(n, end) {        // deterministic launch trace, newest last
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    let v = t < 0.18 ? 0.02 : 0.02 + 0.5 * Math.pow(Math.sin(Math.min(1, (t - 0.18) / 0.5) * Math.PI / 2), 0.7) * Math.exp(-Math.max(0, t - 0.55) * 3);
    v += 0.025 * Math.sin(i * 1.9) * (t > 0.2 ? 1 : 0.3);
    out.push(Math.max(0, Math.min(0.6, v)));
  }
  out[n - 1] = end; out[n - 2] = (out[n - 3] + end) / 2;
  return out;
}

function quantize565(ctx) {
  const im = ctx.getImageData(0, 0, W, H), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i] >> 3, gg = d[i + 1] >> 2, b = d[i + 2] >> 3;
    d[i] = (r << 3) | (r >> 2); d[i + 1] = (gg << 2) | (gg >> 4); d[i + 2] = (b << 3) | (b >> 2); d[i + 3] = 255;
  }
  ctx.putImageData(im, 0, 0);
}
function renderTo(canvas, item, opts = {}) {
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  g = ctx; THEME = item.theme; T = THEMES[THEME]; LANG = item.lang; TOUCH = [];
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.globalAlpha = 1;
  item.draw();
  if (opts.q) quantize565(ctx);
  if (opts.touch) drawTouchOverlay();
}

  }
}

/* ------------------------------------------------------------------ spec generation */
function specFor(item) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  REC = []; renderTo(c, item, { q: false }); const out = REC; REC = null; return out;
}
function mdEsc(s) { return String(s ?? '').replace(/\|/g, '\\|'); }
function mdTable(rows, skipChrome = true) {
  let md = '| id | primitive | geometry | colour | font / text | notes |\n|---|---|---|---|---|---|\n';
  for (const r of rows) {
    if (skipChrome && r.id.startsWith('chrome.')) continue;
    if (r.id === 'bg') continue;
    md += `| \`${r.id}\` | ${mdEsc(r.p)} | ${mdEsc(r.g)} | ${mdEsc(r.c)} | ${r.f ? '`' + r.f + '` ' : ''}${r.t != null ? '“' + mdEsc(r.t) + '”' : ''} | ${mdEsc(r.n)} |\n`;
  }
  return md;
}
function genSpec() {
  const blocks = {};
  // tokens
  let md = '| token | dark hex | dark RGB565 | light hex | light RGB565 | use |\n|---|---|---|---|---|---|\n';
  for (const k of Object.keys(THEMES.dark)) md += `| \`${k}\` | \`${THEMES.dark[k]}\` | \`${hex565(to565(THEMES.dark[k]))}\` | \`${THEMES.light[k]}\` | \`${hex565(to565(THEMES.light[k]))}\` | ${TOKEN_DOC[k] || ''} |\n`;
  blocks.tokens = md;
  // fonts
  const c = document.createElement('canvas'); g = c.getContext('2d');
  md = '| token | file | px | tracking | digits | cap height (H) | digit height (0) | digit cell (tabular) | advance of space | glyph set |\n|---|---|---|---|---|---|---|---|---|---|\n';
  for (const [k, f] of Object.entries(FONTS)) {
    g.font = fontCss(f);
    const mh = g.measureText('H'), m0 = g.measureText('0');
    md += `| \`F_${k}\` | BarlowSemiCondensed-${f.file} | ${f.s} | ${f.track}${f.upper ? ' (UPPERCASE)' : ''} | ${f.tab ? 'tabular' : 'proportional'} | ${Math.round(mh.actualBoundingBoxAscent)} | ${Math.round(m0.actualBoundingBoxAscent)} | ${f.tab ? digitCell(f) : '–'} | ${adv(f, ' ')} | ${f.glyphs ? '`' + f.glyphs.replace(/ /g, '␠') + '`' : 'ASCII + HU + extra (see §2.3)'} |\n`;
  }
  blocks.fonts = md;
  // chrome
  const chromeRows = specFor(I('c', '', () => { rect('bg', 0, 0, W, H, 'bg'); topBar(1, 'Title', { wifi: 1, demo: 1 }); }));
  blocks.chrome = mdTable(chromeRows.filter(r => r.id.startsWith('chrome.')), false);
  // screens
  const all = GALLERY.flatMap(s => s.items).filter(i => i.spec);
  for (const item of all) blocks['screen_' + item.spec] = mdTable(specFor(item));
  return blocks;
}

async function exportAll() {
  const st = document.getElementById('status');
  let n = 0;
  const post = (name, blob) => fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: blob }).then(r => { if (!r.ok) throw new Error(name); });
  const blobOf = c => new Promise(res => c.toBlob(res, 'image/png'));
  for (const { item } of CANVASES) {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    renderTo(c, item, { q: true }); await post(item.name, await blobOf(c)); n++;
    st.textContent = `exported ${n}/${CANVASES.length}`;
  }
  // thumbnails (144x96, RGB565) and icon masks
  for (const [key, src] of Object.entries(THUMBS)) {
    const c = document.createElement('canvas'); c.width = 144; c.height = 96; const x = c.getContext('2d', { willReadFrequently: true });
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, 144, 96);
    const im = x.getImageData(0, 0, 144, 96), d = im.data;
    for (let i = 0; i < d.length; i += 4) { const r = d[i] >> 3, gg = d[i + 1] >> 2, b = d[i + 2] >> 3; d[i] = (r << 3) | (r >> 2); d[i + 1] = (gg << 2) | (gg >> 4); d[i + 2] = (b << 3) | (b >> 2); }
    x.putImageData(im, 0, 0);
    const [th, k] = key.split(':'); await post(`thumbs/skin_${k}_${th}`, await blobOf(c));
  }
  for (const name of Object.keys(ICONS)) for (const size of [16, 20]) {
    const c = document.createElement('canvas'); c.width = c.height = size; g = c.getContext('2d'); T = THEMES.dark;
    icon(null, name, 0, 0, size, '#FFFFFF'); await post(`icons/icon_${name}_${size}`, await blobOf(c));
  }
  const r = await fetch('/spec', { method: 'POST', body: JSON.stringify(genSpec()) });
  st.textContent = `exported ${n} screens + thumbs + icons; spec: ${await r.text()}`;
  renderAll();
  return n;
}

/* review helper: tile screens (quantized) at `scale` into one PNG -> png/review/<out>.png */
async function reviewSheet(names, out, cols = 1, scale = 2) {
  const items = names.map(n => CANVASES.find(c => c.item.name === n).item);
  const rows = Math.ceil(items.length / cols), gap = 8;
  const sheet = document.createElement('canvas'); sheet.width = cols * W * scale + (cols - 1) * gap; sheet.height = rows * H * scale + (rows - 1) * gap;
  const sx = sheet.getContext('2d'); sx.fillStyle = '#333'; sx.fillRect(0, 0, sheet.width, sheet.height); sx.imageSmoothingEnabled = false;
  items.forEach((it, i) => {
    const c = document.createElement('canvas'); c.width = W; c.height = H; renderTo(c, it, { q: true, touch: document.getElementById('optT').checked });
    sx.drawImage(c, (i % cols) * (W * scale + gap), Math.floor(i / cols) * (H * scale + gap), W * scale, H * scale);
  });
  const blob = await new Promise(res => sheet.toBlob(res, 'image/png'));
  await fetch('/save?name=review/' + out, { method: 'POST', body: blob });
  return out;
}

  const tmp = document.createElement('canvas'); g = tmp.getContext('2d');
  buildThumbs();
  buildPage();
  renderAll();
  document.getElementById('warn').textContent = [...new Set(WARN)].join('\n');
  document.getElementById('optQ').onchange = renderAll;
  document.getElementById('optT').onchange = renderAll;
  document.getElementById('opt1x').onchange = e => document.body.classList.toggle('x1', e.target.checked);
  document.getElementById('btnExport').onclick = () => exportAll().catch(e => (document.getElementById('status').textContent = 'export failed: ' + e.message + ' (run design/serve.py)'));
  document.getElementById('status').textContent = `${CANVASES.length} screens rendered`;
  window.__ready = true;
  if (location.search.includes('export=1')) exportAll();
})();
</script>
